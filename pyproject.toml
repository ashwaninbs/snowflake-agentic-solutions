[project]
name = "snowflake-agentic-solutions"
version = "0.1.0"
description = "Reproducible synthetic enterprise data and Streamlit solutions for Snowflake"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.45,<2", "pandas>=2.2,<3"]

[project.scripts]
generate-demo-data = "synthetic_data.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_data"]
